###############################################################################
# Kafka + Zookeeper — K8s StatefulSet
###############################################################################
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
# Zookeeper
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: kafka
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: kafka
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
  clusterIP: None
---
# Kafka Broker
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: remove-lost-found
          image: busybox
          command: ['sh', '-c', 'rm -rf /var/lib/kafka/data/lost+found']
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_BROKER_ID
              value: "0"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper.kafka.svc.cluster.local:2181"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka-0.kafka.kafka.svc.cluster.local:9092,EXTERNAL://localhost:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  clusterIP: None   # headless: StatefulSet pod DNS 활성화 (kafka-0.kafka.kafka.svc.cluster.local)
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
    - name: external
      port: 9093
      targetPort: 9093
---
# 외부 포트포워딩용 ClusterIP 서비스 (edge-agent localhost:9093 → GKE)
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: external
      port: 9093
      targetPort: 9093
---
# Kafka topic init Job
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: kafka
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka.kafka.svc.cluster.local 9092; do echo "Waiting for Kafka..."; sleep 3; done']
      containers:
        - name: create-topics
          image: confluentinc/cp-kafka:7.5.0
          command:
            - sh
            - -c
            - |
              kafka-topics --create --if-not-exists --bootstrap-server kafka.kafka.svc.cluster.local:9092 --topic sensor-telemetry --partitions 3 --replication-factor 1
              kafka-topics --create --if-not-exists --bootstrap-server kafka.kafka.svc.cluster.local:9092 --topic anomaly-events-critical --partitions 3 --replication-factor 1
              kafka-topics --create --if-not-exists --bootstrap-server kafka.kafka.svc.cluster.local:9092 --topic anomaly-events-low --partitions 3 --replication-factor 1
              kafka-topics --create --if-not-exists --bootstrap-server kafka.kafka.svc.cluster.local:9092 --topic fault-diagnosis-results --partitions 3 --replication-factor 1
              kafka-topics --create --if-not-exists --bootstrap-server kafka.kafka.svc.cluster.local:9092 --topic notification-events --partitions 3 --replication-factor 1
              echo "Topics created"
              kafka-topics --list --bootstrap-server kafka.kafka.svc.cluster.local:9092
