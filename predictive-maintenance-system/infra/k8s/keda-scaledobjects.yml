---
# anomaly-consumer: Kafka lag 기반 자동 스케일링
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: anomaly-consumer-scaledobject
  namespace: predictive-maintenance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anomaly-consumer
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: "kafka.kafka.svc.cluster.local:9092"
        consumerGroup: anomaly-consumer-group
        topic: anomaly-events
        lagThreshold: "5"
        offsetResetPolicy: latest

---
# telemetry-consumer: Kafka lag 기반 자동 스케일링
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: telemetry-consumer-scaledobject
  namespace: predictive-maintenance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetry-consumer
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: "kafka.kafka.svc.cluster.local:9092"
        consumerGroup: telemetry-consumer-group
        topic: sensor-telemetry
        lagThreshold: "10"
        offsetResetPolicy: latest
