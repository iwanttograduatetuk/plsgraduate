spring:
  application:
    name: monitoring-api

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predictive_maintenance}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

influxdb:
  url: ${INFLUXDB_URL:http://localhost:8086}
  token: ${INFLUXDB_TOKEN:my-token}
  org: ${INFLUXDB_ORG:predictive-maintenance}
  bucket: ${INFLUXDB_BUCKET:sensor-scores}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      service: monitoring-api
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.predictive: INFO

kafka:
  topics:
    anomaly-events-critical: anomaly-events-critical
    anomaly-events-low: anomaly-events-low
